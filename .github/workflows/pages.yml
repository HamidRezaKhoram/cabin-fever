# Publish the browser version to GitHub Pages on every push to main.
# The site is only files: each TV's browser hosts its own room and phones connect to it directly.
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Cache the narrator voice (Kokoro model)
        uses: actions/cache@v4
        with: { path: vendor/kokoro, key: kokoro-${{ hashFiles('tools/fetch-kokoro.js', 'package-lock.json') }} }
      - name: Fetch the narrator voice (served from the site; the TV caches it on first use)
        run: node tools/fetch-kokoro.js vendor/kokoro
      - name: Build the browser version (tools/build-pages.js)
        run: node tools/build-pages.js dist
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
