<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#14121f">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>Cabin Fever — Phone</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="play">
  <canvas id="bg"></canvas>
  <header class="playbar">
    <span class="brand small">CABIN FEVER</span>
    <span id="conn-dot" class="conn-dot" data-state="wait" title="Connecting…" aria-hidden="true"></span>
    <span id="me-tag"></span>
    <span id="phone-timer" class="timer" aria-hidden="true"></span>
    <button id="text-size" class="link-btn" aria-label="Change text size">Aa</button>
    <button id="cb-btn" class="link-btn" aria-label="Colour-blind friendly colours" aria-pressed="false">👁</button>
    <button id="leave-btn" class="link-btn leave-btn" hidden>🚪 Leave</button>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="status-line" class="status-line" hidden aria-live="polite"></div>

  <main id="screen">
    <section id="join-view">
      <h1>Join a room</h1>
      <form id="join-form">
        <div class="join-row">
          <div class="join-field join-field-code">
            <label for="code-input">Room</label>
            <input id="code-input" maxlength="4" autocomplete="off" autocapitalize="characters"
                   placeholder="ABCD" pattern="[A-Za-z]{4}" aria-describedby="join-error" spellcheck="false" required>
          </div>
          <div class="join-field">
            <label for="nick-input">Your name</label>
            <input id="nick-input" maxlength="16" autocomplete="off" placeholder="Name" aria-describedby="join-error" required>
          </div>
        </div>
        <label>Your look</label>
        <div class="avatar-mode">
          <button type="button" data-mode="make">🧑 Character</button>
          <button type="button" data-mode="pick">🐾 Animal</button>
        </div>
        <div id="avatar-make" class="avatar-make"></div>
        <div id="avatar-pick" class="avatar-pick"></div>
        <button type="submit" class="join-go">Join ▶</button>
      </form>
      <p id="join-error" class="error" role="alert"></p>
    </section>

    <section id="game-view" hidden aria-live="polite"></section>
    <section id="lobby-maker" class="lobby-maker" hidden aria-label="Change your look">
      <div class="lobby-maker-head">
        <div class="avatar-mode lobby-mode">
          <button type="button" data-lobby-mode="make">🧑 Character</button>
          <button type="button" data-lobby-mode="pick">🐾 Animal</button>
        </div>
        <button id="lobby-maker-save">✓ Done</button>
      </div>
      <div id="lobby-maker-box"></div>
      <div id="lobby-animals" class="avatar-pick lobby-pick" hidden></div>
    </section>
    <div id="pace-bar" class="pace-bar" hidden></div>
  </main>

  <nav id="react-bar" class="react-bar" hidden></nav>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/debug.js"></script>
  <script src="/common.js"></script>
  <script src="/i18n.js"></script>
  <script src="/clock.js"></script>
  <script src="/sprites.js"></script>
  <script src="/avatar-maker.js"></script>
  <script src="/bg.js"></script>
  <script src="/draw.js"></script>
  <script src="/games.js"></script>
  <script src="/play.js"></script>
</body>
</html>
